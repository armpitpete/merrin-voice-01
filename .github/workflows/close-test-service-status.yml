name: Close test service status

on:
  push:
    branches:
      - v5.2-native-schematic-capture-erc
    paths:
      - "tools/close_test_service_status.py"
      - ".github/workflows/close-test-service-status.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-status:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply accepted sheet-09 status
        run: python tools/close_test_service_status.py

      - name: Commit hardware status
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardware/memory-core-prototype-a/README.md
          if git diff --cached --quiet; then
            echo "Hardware README already reflects sheet-09 closure."
            exit 0
          fi
          git commit -m "Close test service schematic gate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
