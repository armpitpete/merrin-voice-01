name: Temporary apply SSI2164 buffer

on:
  push:
    branches:
      - agent/ssi2164-buffered-control
    paths:
      - "tools/apply_ssi2164_buffer_patch.py"
      - "tools/apply_ssi2164_buffer_coordinate_repair_patch.py"
      - ".github/workflows/temporary-apply-ssi2164-buffer.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tools/apply_ssi2164_buffer_patch.py"
      - "tools/apply_ssi2164_buffer_coordinate_repair_patch.py"
      - ".github/workflows/temporary-apply-ssi2164-buffer.yml"

permissions:
  contents: read

env:
  KICAD_IMAGE: ghcr.io/kicad/kicad:10.0.4@sha256:770e2fa006695077b5ba218742d5c3137896af91257b2ca971243fa56b01bb86

jobs:
  diagnose-validators:
    if: github.head_ref == 'agent/ssi2164-buffered-control' || github.ref_name == 'agent/ssi2164-buffered-control'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/ssi2164-buffered-control
          fetch-depth: 0

      - name: Enforce diagnostic-only state
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git branch --show-current)" = "agent/ssi2164-buffered-control"
          test ! -f hardware/memory-core-prototype-a/SSI2164_BUFFER_AUDIT.json
          test "$(git status --short)" = ""
          echo "Diagnostic-only run: no ERC and no repository write step are present."

      - name: Install pinned schematic generator
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends kicad-symbols
          python -m pip install --disable-pip-version-check \
            "git+https://github.com/circuit-synth/kicad-sch-api.git@505bca23e91cf3fa6e3b66976e529e775eada3ba"

      - name: Apply unchanged exact-hash electrical and coordinate patches
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/generator build/validation
          python tools/apply_ssi2164_buffer_patch.py 2>&1 | tee build/generator/electrical-patch.log
          python tools/apply_ssi2164_buffer_coordinate_repair_patch.py 2>&1 | tee build/generator/coordinate-patch.log

      - name: Regenerate unchanged authoritative sheets
        shell: bash
        run: |
          set -Eeuo pipefail
          set -o pipefail
          python tools/capture_return_break_limiter_sheet_v3.py 2>&1 | tee build/generator/return-sheet.log
          python tools/capture_memory_ghost_wet_sheet_v2.py 2>&1 | tee build/generator/memory-ghost-wet.log

      - name: Validate SSI2164 buffered-control lane
        id: buffer_lane
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -u tools/validate_ssi2164_buffer_lane.py 2>&1 | tee build/validation/validate-ssi2164-buffer-lane.log

      - name: Validate Memory Ghost wet capture
        id: memory_ghost
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -u tools/validate_memory_ghost_wet_capture.py 2>&1 | tee build/validation/validate-memory-ghost-wet-capture.log

      - name: Validate current schematic stage
        id: current_stage
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -u tools/validate_current_schematic_stage.py 2>&1 | tee build/validation/validate-current-schematic-stage.log

      - name: Record validator outcomes
        if: always()
        shell: bash
        run: |
          {
            echo "validate_ssi2164_buffer_lane=${{ steps.buffer_lane.outcome }}"
            echo "validate_memory_ghost_wet_capture=${{ steps.memory_ghost.outcome }}"
            echo "validate_current_schematic_stage=${{ steps.current_stage.outcome }}"
          } | tee build/validation/outcomes.txt

      - name: Upload generator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssi2164-buffer-generator-diagnostics
          path: build/generator
          if-no-files-found: error

      - name: Upload validator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssi2164-buffer-validator-diagnostics
          path: build/validation
          if-no-files-found: error

      - name: Fail on any validator failure
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.buffer_lane.outcome }}" = "success"
          test "${{ steps.memory_ghost.outcome }}" = "success"
          test "${{ steps.current_stage.outcome }}" = "success"
          echo "All validators passed; diagnostic gate still stops here by design."
