name: KiCad Memory Ghost wet sheet ERC

on:
  push:
    branches:
      - v5.2-native-schematic-capture-erc
    paths:
      - "tools/capture_memory_ghost_wet_sheet.py"
      - "tools/capture_return_break_limiter_sheet.py"
      - "tools/capture_return_break_limiter_sheet_v2.py"
      - ".github/workflows/kicad-memory-ghost-wet-sheet-erc.yml"
      - ".github/workflows/kicad-return-sheet-erc.yml"
      - "hardware/memory-core-prototype-a/05_MEMORY_GHOST_WET*"
      - "hardware/memory-core-prototype-a/06_RETURN_BREAK_LIMITER*"
      - "hardware/memory-core-prototype-a/MerrinGriefSynthMemoryCoreA.kicad_sch"
      - "hardware/memory-core-prototype-a/hierarchy-manifest.json"
      - "hardware/memory-core-prototype-a/MerrinLab_PrototypeA.kicad_sym"
      - "hardware/memory-core-prototype-a/README.md"
  pull_request:
    paths:
      - "tools/capture_memory_ghost_wet_sheet.py"
      - "tools/capture_return_break_limiter_sheet.py"
      - "tools/capture_return_break_limiter_sheet_v2.py"
      - ".github/workflows/kicad-memory-ghost-wet-sheet-erc.yml"
      - ".github/workflows/kicad-return-sheet-erc.yml"
      - "hardware/memory-core-prototype-a/05_MEMORY_GHOST_WET*"
      - "hardware/memory-core-prototype-a/06_RETURN_BREAK_LIMITER*"
      - "hardware/memory-core-prototype-a/MerrinGriefSynthMemoryCoreA.kicad_sch"
      - "hardware/memory-core-prototype-a/hierarchy-manifest.json"
      - "hardware/memory-core-prototype-a/MerrinLab_PrototypeA.kicad_sym"
      - "hardware/memory-core-prototype-a/README.md"
  workflow_dispatch:

permissions:
  contents: write

env:
  KICAD_SYMBOL_DIR: /usr/share/kicad/symbols
  KICAD_IMAGE: ghcr.io/kicad/kicad:10.0.4@sha256:770e2fa006695077b5ba218742d5c3137896af91257b2ca971243fa56b01bb86

jobs:
  memory-ghost-wet-sheet-erc:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect committed Memory Ghost wet stage
        id: stage
        shell: bash
        run: |
          marker="hardware/memory-core-prototype-a/05_MEMORY_GHOST_WET_CAPTURED"
          if [ -f "$marker" ]; then
            echo "wet=true" >> "$GITHUB_OUTPUT"
            echo "Using committed Memory/Ghost/wet capture."
          else
            echo "wet=false" >> "$GITHUB_OUTPUT"
            echo "Memory/Ghost/wet remains a scaffold."
          fi

      - name: Install symbol libraries and pinned schematic generator
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends kicad-symbols
          python -m pip install --disable-pip-version-check \
            "git+https://github.com/circuit-synth/kicad-sch-api.git@505bca23e91cf3fa6e3b66976e529e775eada3ba"
          python -c "import kicad_sch_api; print('kicad-sch-api import: OK')"

      - name: Verify pinned official KiCad CLI image
        run: |
          docker pull "$KICAD_IMAGE"
          docker run --rm "$KICAD_IMAGE" kicad-cli --version
          docker run --rm "$KICAD_IMAGE" kicad-cli sch erc --help

      - name: Capture integrated U60 ownership and sheet 05
        if: steps.stage.outputs.wet == 'false'
        shell: bash
        run: |
          mkdir -p build/generator
          set -o pipefail
          python tools/capture_return_break_limiter_sheet_v2.py 2>&1 | tee build/generator/memory-ghost-wet.log
          python tools/capture_memory_ghost_wet_sheet.py 2>&1 | tee -a build/generator/memory-ghost-wet.log

      - name: Validate Memory Ghost wet capture contract
        run: |
          python - <<'PY'
          import importlib.util
          import math
          import re
          from collections import Counter
          from pathlib import Path

          import kicad_sch_api as ksa

          root = Path('hardware/memory-core-prototype-a')
          sheet05_path = root / '05_MEMORY_GHOST_WET.kicad_sch'
          sheet06_path = root / '06_RETURN_BREAK_LIMITER.kicad_sch'
          library_path = root / 'MerrinLab_PrototypeA.kicad_sym'

          assert (root / '05_MEMORY_GHOST_WET_CAPTURED').exists()
          assert (root / '06_RETURN_BREAK_LIMITER_CAPTURED').exists()
          assert sheet05_path.exists()
          assert sheet06_path.exists()

          spec = importlib.util.spec_from_file_location(
              'memory_ghost_wet_capture', 'tools/capture_memory_ghost_wet_sheet.py'
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          assert set(module.HIER_INPUTS) == {
              'RAIL_P12', 'RAIL_N12', 'MEMORY_DAC', 'GHOST_DAC',
              'VCA_MEMORY_CTRL', 'VCA_GHOST_CTRL', 'VCA_WET_CTRL',
          }
          assert module.HIER_OUTPUTS == ('WET_MIX',)
          assert module.ALLOWED_EXPORTS == frozenset({'WET_MIX'})
          assert module.SSI_REFERENCE == 'U60'
          assert module.SSI_CHANNEL_PINS == {
              1: {'iin': '2', 'vc': '3', 'iout': '4', 'role': 'MEMORY'},
              2: {'iin': '7', 'vc': '6', 'iout': '5', 'role': 'GHOST'},
              4: {'iin': '10', 'vc': '11', 'iout': '12', 'role': 'WET MASTER'},
          }
          assert math.isclose(module.VCA_INPUT_KOHM, module.VCA_IV_KOHM)
          assert math.isclose(module.SUM_BRANCH_GAIN, 20.0 / 40.2, abs_tol=1e-12)
          assert 0.497 < module.SUM_BRANCH_GAIN < 0.498
          assert 2 * module.SUM_BRANCH_GAIN < 1.0

          cache = ksa.get_symbol_cache()
          cache.add_library_path(str(library_path.resolve()))
          sheet05 = ksa.load_schematic(str(sheet05_path))
          sheet06 = ksa.load_schematic(str(sheet06_path))

          units05 = sorted(
              component._data.unit
              for component in sheet05.components
              if component.reference == 'U60' and component.lib_id.endswith('SSI2164S_MULTI')
          )
          units06 = sorted(
              component._data.unit
              for component in sheet06.components
              if component.reference == 'U60' and component.lib_id.endswith('SSI2164S_MULTI')
          )
          assert units05 == [1, 2, 4], units05
          assert units06 == [3, 5], units06
          assert sorted(units05 + units06) == [1, 2, 3, 4, 5]

          ssi_entries = []
          for path in sorted(root.glob('[0-9][0-9]_*.kicad_sch')):
              schematic = ksa.load_schematic(str(path))
              for component in schematic.components:
                  if component.lib_id.endswith('SSI2164S_MULTI'):
                      ssi_entries.append((path.name, component.reference, component._data.unit))
          assert len(ssi_entries) == 5, ssi_entries
          assert {reference for _path, reference, _unit in ssi_entries} == {'U60'}
          assert sorted(unit for _path, _reference, unit in ssi_entries) == [1, 2, 3, 4, 5]

          for component in sheet05.components:
              if component.reference == 'U60':
                  pins = module.SSI_CHANNEL_PINS[component._data.unit]
                  for pin in (pins['iin'], pins['vc'], pins['iout']):
                      assert component.get_pin_position(pin) is not None, (component._data.unit, pin)

          references = [
              component.reference
              for component in sheet05.components
              if not component.reference.startswith('#')
          ]
          duplicate_refs = sorted(
              reference
              for reference, count in Counter(references).items()
              if count > 1 and reference != 'U60'
          )
          assert not duplicate_refs, duplicate_refs
          assert references.count('U60') == 3

          text05 = sheet05_path.read_text(encoding='utf-8')
          text06 = sheet06_path.read_text(encoding='utf-8')
          labels = re.findall(
              r'\(hierarchical_label "([^"]+)"\s+\(shape ([^)]+)\)',
              text05,
              re.MULTILINE,
          )
          inputs = {name for name, shape in labels if shape == 'input'}
          outputs = {name for name, shape in labels if shape == 'output'}
          assert inputs == set(module.HIER_INPUTS), inputs
          assert outputs == {'WET_MIX'}, outputs

          for token in (
              'SSI2164 — MEMORY CH1', 'SSI2164 — GHOST CH2',
              'SSI2164 — WET MASTER CH4', '40.2k 1% Memory sum',
              '40.2k 1% Ghost sum', '20k 1% half-sum feedback',
              '47R output isolate', 'Only WET_MIX crosses',
              'no second SSI2164 is created',
          ):
              assert token in text05, token
          assert 'visible staged reservations for sheet 05' not in text06
          assert 'same physical SSI2164' not in text06

          print('Memory/Ghost/wet symbol, physical-pin, gain, export and shared-device contract: PASS')
          PY

      - name: Run KiCad 10 hierarchical ERC
        shell: bash
        run: |
          mkdir -p build/erc
          chmod a+rwx build/erc
          top="hardware/memory-core-prototype-a/MerrinGriefSynthMemoryCoreA.kicad_sch"
          report="build/erc/MerrinGriefSynthMemoryCoreA-erc.rpt"
          set -o pipefail
          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            "$KICAD_IMAGE" \
            kicad-cli sch erc \
              --severity-all \
              --output "$report" \
              "$top" 2>&1 | tee build/erc/kicad-cli.log
          cat "$report"

      - name: Enforce captured-sheet ERC policy
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path('build/erc/MerrinGriefSynthMemoryCoreA-erc.rpt').read_text(encoding='utf-8')
          summary = re.search(r'\*\* ERC messages:\s+(\d+)\s+Errors\s+(\d+)\s+Warnings', text)
          if not summary:
              raise SystemExit('ERC summary was not found')

          errors = int(summary.group(1))
          warnings = int(summary.group(2))
          codes = re.findall(r'^\[([^\]]+)\]:', text, re.MULTILINE)
          unexpected = sorted(set(codes) - {'isolated_pin_label'})
          if errors:
              raise SystemExit(f'Memory/Ghost/wet schematic stage has {errors} ERC error(s)')
          if unexpected:
              raise SystemExit(f'Unexpected ERC classes: {unexpected}')

          captured = (
              '01 POWER / PROTECTION',
              '02 MCU / CLOCK / DEBUG',
              '03 CODEC / CONVERSION',
              '04 INPUT / PRESSURE / ABSENCE',
              '05 MEMORY / GHOST / WET',
              '06 RETURN / BREAK / LIMITER',
              '08 CONTROLS / STATE / SAFE SELECTOR',
          )
          for sheet_name in captured:
              match = re.search(
                  rf'\*\* Sheet /{re.escape(sheet_name)}(?P<body>.*?)(?=\*\* Sheet |\*\* ERC messages:)',
                  text,
                  re.DOTALL,
              )
              if match and '[isolated_pin_label]:' in match.group('body'):
                  raise SystemExit(f'{sheet_name} still contains temporary isolated labels')

          print(f'Memory/Ghost/wet ERC: PASS — 0 errors, {warnings} remaining scaffold warning(s)')
          PY

      - name: Promote first passing Memory Ghost wet sheet
        if: github.event_name == 'push' && steps.stage.outputs.wet == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          root="hardware/memory-core-prototype-a"
          git add \
            "$root/05_MEMORY_GHOST_WET.kicad_sch" \
            "$root/05_MEMORY_GHOST_WET_CAPTURED" \
            "$root/06_RETURN_BREAK_LIMITER.kicad_sch" \
            "$root/06_RETURN_BREAK_LIMITER_CAPTURED" \
            "$root/MerrinLab_PrototypeA.kicad_sym"
          if git diff --cached --quiet; then
            echo "No validated Memory/Ghost/wet stage to promote."
            exit 0
          fi
          git commit -m "Capture ERC-validated Memory Ghost wet sheet"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload generator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-ghost-wet-generator-log
          path: build/generator
          if-no-files-found: ignore

      - name: Upload native hierarchy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-ghost-wet-native-hierarchy
          path: hardware/memory-core-prototype-a
          if-no-files-found: error

      - name: Upload ERC diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-ghost-wet-erc-report
          path: build/erc
          if-no-files-found: ignore
