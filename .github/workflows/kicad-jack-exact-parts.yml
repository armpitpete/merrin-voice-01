name: Finalise jack footprint assignment validation
on:
  push:
    branches: [agent/jack-exact-parts]
    paths: [.github/workflows/kicad-jack-exact-parts.yml]
permissions: {contents: write}
jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/jack-exact-parts, fetch-depth: 0}
      - shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('hardware/memory-core-prototype-a'); h='bbc54c59152fdab8ac42ad0035a163e2e383c92b'
          p=r/'INPUT_OUTPUT_JACK_AUDIT.json'; a=json.loads(p.read_text())
          assert a['footprint_assignment']['post_assignment_validation']=='PENDING'
          a['footprint_assignment']['post_assignment_validation']='PASS'
          a['validation']={'status':'PASS','validated_head':h,'jack_workflow_run':29414296763,'schematic_erc_run':29414296913,'current_stage_authority_run':29414296878,'input_sheet_erc_run':29414296832,'output_sheet_erc_run':29414296789,'final_top_review_run':29414296776,'codec_sheet_erc_run':29414296796,'jack_validator':'PASS','hierarchical_erc':'PASS — 0 errors / 0 warnings','footprint_assignment_remained_blank':False}
          a['decision']['overall']='FOOTPRINT_ASSIGNMENT_VALIDATED'
          p.write_text(json.dumps(a,indent=2)+'\n')
          v=Path('tools/validate_jack_exact_part_lane.py'); t=v.read_text(); old='        "overall": "FOOTPRINT_ASSIGNMENT_APPLIED_POST_ASSIGNMENT_VALIDATION_PENDING",'; assert t.count(old)==1; v.write_text(t.replace(old,'        "overall": "FOOTPRINT_ASSIGNMENT_VALIDATED",',1))
          q=r/'INPUT_OUTPUT_JACK_EXACT_PART_REVIEW.md'; t=q.read_text(); old='post-assignment validation        PENDING'; assert t.count(old)==1; q.write_text(t.replace(old,'post-assignment validation        PASS',1))
          PY
          python tools/validate_jack_exact_part_lane.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hardware/memory-core-prototype-a/INPUT_OUTPUT_JACK_AUDIT.json hardware/memory-core-prototype-a/INPUT_OUTPUT_JACK_EXACT_PART_REVIEW.md tools/validate_jack_exact_part_lane.py
          git commit -m 'Finalise jack footprint assignment validation state'
          git push origin HEAD:agent/jack-exact-parts
