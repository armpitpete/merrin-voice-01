name: Synchronise assigned jack footprint state
on:
  push:
    branches: [agent/jack-exact-parts]
    paths: [.github/workflows/kicad-jack-exact-parts.yml]
permissions: {contents: write}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/jack-exact-parts, fetch-depth: 0}
      - shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('hardware/memory-core-prototype-a'); c='f34eea95c216cd31df4d4e3f1498adc4b9014ec9'; fp='MerrinLab_PrototypeA:Jack_3.5mm_Thonkiconn_WQP518MA_Numeric'
          def once(p,a,b):
            p=Path(p); t=p.read_text(); assert t.count(a)==1,(p,a,t.count(a)); p.write_text(t.replace(a,b,1))
          def append(p,m,s):
            p=Path(p); t=p.read_text();
            if m not in t:p.write_text(t.rstrip()+'\n\n'+s+'\n')
          p=r/'INPUT_OUTPUT_JACK_AUDIT.json'; a=json.loads(p.read_text())
          assert a['project_numeric_footprint']['assignment_status']=='INDEPENDENT_REVIEW_APPROVED_ASSIGNMENT_NOT_YET_PERFORMED'
          a['project_numeric_footprint']['assignment_status']='ASSIGNED_TO_J40_J70'
          a['independent_review'].update(footprint_assignment_performed=True,assignment_commit=c)
          a['footprint_assignment']={'footprint':fp,'J40':'ASSIGNED','J70':'ASSIGNED','project_symbol_default':'BLANK','assignment_commit':c,'post_assignment_validation':'PENDING','pcb_placement_authorised':False,'panel_fabrication_authorised':False,'purchasing_authorised':False}
          a['validation']={'status':'PENDING_POST_ASSIGNMENT_CI','assignment_commit':c,'footprint_assignment_remained_blank':False}
          a['decision'].update(panel_stack='APPROVED_AND_FOOTPRINT_ASSIGNMENT_APPLIED',footprints_assigned=True,overall='FOOTPRINT_ASSIGNMENT_APPLIED_POST_ASSIGNMENT_VALIDATION_PENDING')
          p.write_text(json.dumps(a,indent=2)+'\n')
          v=Path('tools/validate_jack_exact_part_lane.py')
          once(v,'        assert row["footprint"] == "", row\n        assert FOOTPRINT_ID not in row["block"]','        assert row["footprint"] == FOOTPRINT_ID, row\n        assert row["block"].count(FOOTPRINT_ID) == 1, row')
          once(v,'    assert_generator_contracts(\n        INPUT_GENERATOR.read_text(encoding="utf-8"),\n        OUTPUT_GENERATOR.read_text(encoding="utf-8"),\n    )','    input_generator_text = INPUT_GENERATOR.read_text(encoding="utf-8")\n    output_generator_text = OUTPUT_GENERATOR.read_text(encoding="utf-8")\n    assert_generator_contracts(input_generator_text, output_generator_text)\n    assert input_generator_text.count(FOOTPRINT_ID) == 1\n    assert output_generator_text.count(FOOTPRINT_ID) == 1')
          once(v,'        numeric["assignment_status"]\n        == "INDEPENDENT_REVIEW_APPROVED_ASSIGNMENT_NOT_YET_PERFORMED"','        numeric["assignment_status"]\n        == "ASSIGNED_TO_J40_J70"')
          once(v,'        "footprint_assignment_performed": False,\n        "pcb_placement_authorised": False,','        "footprint_assignment_performed": True,\n        "assignment_commit": "f34eea95c216cd31df4d4e3f1498adc4b9014ec9",\n        "pcb_placement_authorised": False,')
          once(v,'        "J40 footprint field                    BLANK",','        "J40 footprint field                    ASSIGNED",\n        "J70 footprint field                    ASSIGNED",')
          once(v,'        "panel_stack": "APPROVED_FOR_NEXT_BOUNDED_FOOTPRINT_ASSIGNMENT_GATE",','        "panel_stack": "APPROVED_AND_FOOTPRINT_ASSIGNMENT_APPLIED",')
          once(v,'        "footprints_assigned": False,','        "footprints_assigned": True,')
          once(v,'        "overall": "INDEPENDENT_REVIEW_COMPLETE_READY_FOR_BOUNDED_FOOTPRINT_ASSIGNMENT",','        "overall": "FOOTPRINT_ASSIGNMENT_APPLIED_POST_ASSIGNMENT_VALIDATION_PENDING",')
          once(v,'        "footprints assigned                         none",\n        "ready for bounded footprint assignment",','        "bounded j40/j70 footprint assignment",\n        "j40 footprint field               assigned",\n        "j70 footprint field               assigned",')
          once(v,'    print("Next bounded footprint-assignment gate: AUTHORISED")\n    print("J40/J70 footprint assignment remains blank in review-only state: PASS")','    print("Bounded J40/J70 footprint assignment: PASS")\n    print("Project symbol default footprint remains blank: PASS")')
          section=f'''## Bounded J40/J70 footprint assignment\n\n```text\nJ40 footprint field               ASSIGNED\nJ70 footprint field               ASSIGNED\nproject symbol default            BLANK\nassignment commit                 {c}\npost-assignment validation        PENDING\nPCB / panel fab / purchasing      BLOCKED\n```'''
          append(r/'INPUT_OUTPUT_JACK_EXACT_PART_REVIEW.md','## Bounded J40/J70 footprint assignment',section)
          append(r/'WQP518MA_PANEL_STACK_MEASUREMENT_RECORD.md','## Post-review footprint assignment',f'''## Post-review footprint assignment\n\n```text\nJ40 footprint field                    ASSIGNED\nJ70 footprint field                    ASSIGNED\nproject symbol default footprint       BLANK\nassignment commit                      {c}\nPCB placement, routing, panel fabrication and purchasing remain blocked\n```''')
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hardware/memory-core-prototype-a tools/validate_jack_exact_part_lane.py
          git commit -m 'Synchronise J40 J70 footprint assignment state'
          git push origin HEAD:agent/jack-exact-parts
