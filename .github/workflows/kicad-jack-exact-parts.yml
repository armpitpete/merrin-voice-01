name: Apply bounded J40 J70 footprint assignment
on:
  push:
    branches: [agent/jack-exact-parts]
    paths: [.github/workflows/kicad-jack-exact-parts.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/jack-exact-parts
          fetch-depth: 0
      - name: Apply authorised assignment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          fp='MerrinLab_PrototypeA:Jack_3.5mm_Thonkiconn_WQP518MA_Numeric'
          def repl(p,a,b):
            p=Path(p); t=p.read_text(); assert t.count(a)==1 and b not in t
            p.write_text(t.replace(a,b,1))
          repl('tools/capture_input_pressure_absence_sheet.py',
            '    add_part(sch, "MerrinLab_PrototypeA:WQP518MA_APPLICATION", "J40", "WQP518MA / THONKICONN INPUT", (55.88, 91.44))',
            f'    add_part(sch, "MerrinLab_PrototypeA:WQP518MA_APPLICATION", "J40", "WQP518MA / THONKICONN INPUT", (55.88, 91.44), "{fp}")')
          repl('tools/capture_output_mute_protection_sheet.py',
            '    add_part(sch, "MerrinLab_PrototypeA:WQP518MA_APPLICATION", "J70", "WQP518MA / THONKICONN OUTPUT", (386.08, 124.46))',
            f'    add_part(sch, "MerrinLab_PrototypeA:WQP518MA_APPLICATION", "J70", "WQP518MA / THONKICONN OUTPUT", (386.08, 124.46), "{fp}")')
          def block(t,s):
            d=0; q=False; e=False
            for i in range(s,len(t)):
              c=t[i]
              if q:
                if e:e=False
                elif c=='\\':e=True
                elif c=='"':q=False
              elif c=='"':q=True
              elif c=='(':d+=1
              elif c==')':
                d-=1
                if d==0:return t[s:i+1],i+1
            raise AssertionError('unterminated')
          def assign(path,ref):
            p=Path(path); t=p.read_text(); m='\n\t(symbol\n\t\t(lib_id '; o=0; hits=[]
            while True:
              f=t.find(m,o)
              if f<0:break
              s=f+2; b,e=block(t,s); o=e
              if f'(property "Reference" "{ref}"' in b:hits.append((s,e,b))
            assert len(hits)==1
            s,e,b=hits[0]; a='(property "Footprint" ""'; n=f'(property "Footprint" "{fp}"'
            assert b.count(a)==1 and n not in b
            p.write_text(t[:s]+b.replace(a,n,1)+t[e:])
          assign('hardware/memory-core-prototype-a/04_INPUT_PRESSURE_ABSENCE.kicad_sch','J40')
          assign('hardware/memory-core-prototype-a/07_OUTPUT_MUTE_PROTECTION.kicad_sch','J70')
          PY
          git diff --check
          git diff --name-only | sort > /tmp/actual
          printf '%s\n' hardware/memory-core-prototype-a/04_INPUT_PRESSURE_ABSENCE.kicad_sch hardware/memory-core-prototype-a/07_OUTPUT_MUTE_PROTECTION.kicad_sch tools/capture_input_pressure_absence_sheet.py tools/capture_output_mute_protection_sheet.py | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Assign approved WQP518MA footprint to J40 and J70'
          git push origin HEAD:agent/jack-exact-parts
