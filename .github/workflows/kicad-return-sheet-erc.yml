name: KiCad Return sheet ERC

on:
  push:
    branches:
      - v5.2-native-schematic-capture-erc
    paths:
      - "tools/capture_return_break_limiter_sheet.py"
      - ".github/workflows/kicad-return-sheet-erc.yml"
      - "hardware/memory-core-prototype-a/06_RETURN_BREAK_LIMITER*"
      - "hardware/memory-core-prototype-a/MerrinLab_PrototypeA.kicad_sym"
  pull_request:
    paths:
      - "tools/capture_return_break_limiter_sheet.py"
      - ".github/workflows/kicad-return-sheet-erc.yml"
      - "hardware/memory-core-prototype-a/06_RETURN_BREAK_LIMITER*"
      - "hardware/memory-core-prototype-a/MerrinLab_PrototypeA.kicad_sym"
  workflow_dispatch:

permissions:
  contents: write

env:
  KICAD_SYMBOL_DIR: /usr/share/kicad/symbols
  KICAD_IMAGE: ghcr.io/kicad/kicad:10.0.4@sha256:770e2fa006695077b5ba218742d5c3137896af91257b2ca971243fa56b01bb86

jobs:
  return-sheet-erc:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect committed Return stage
        id: stage
        shell: bash
        run: |
          marker="hardware/memory-core-prototype-a/06_RETURN_BREAK_LIMITER_CAPTURED"
          if [ -f "$marker" ]; then
            echo "return=true" >> "$GITHUB_OUTPUT"
            echo "Using committed Return/Break/limiter capture."
          else
            echo "return=false" >> "$GITHUB_OUTPUT"
            echo "Return/Break/limiter remains a scaffold."
          fi

      - name: Install symbol libraries and pinned schematic generator
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends kicad-symbols
          python -m pip install --disable-pip-version-check \
            "git+https://github.com/circuit-synth/kicad-sch-api.git@505bca23e91cf3fa6e3b66976e529e775eada3ba"
          python -c "import kicad_sch_api; print('kicad-sch-api import: OK')"
          test -f "$KICAD_SYMBOL_DIR/Connector_Generic.kicad_sym"

      - name: Verify pinned official KiCad CLI image
        run: |
          docker pull "$KICAD_IMAGE"
          docker run --rm "$KICAD_IMAGE" kicad-cli --version
          docker run --rm "$KICAD_IMAGE" kicad-cli sch erc --help

      - name: Capture 06 Return Break limiter sheet
        if: steps.stage.outputs.return == 'false'
        shell: bash
        run: |
          mkdir -p build/generator
          set -o pipefail
          python tools/capture_return_break_limiter_sheet.py 2>&1 | tee build/generator/return-sheet.log

      - name: Validate Return capture contract
        run: |
          python - <<'PY'
          import importlib.util
          import math
          from pathlib import Path

          root = Path('hardware/memory-core-prototype-a')
          assert (root / '06_RETURN_BREAK_LIMITER_CAPTURED').exists()
          sheet_path = root / '06_RETURN_BREAK_LIMITER.kicad_sch'
          assert sheet_path.exists()

          spec = importlib.util.spec_from_file_location(
              'return_capture', 'tools/capture_return_break_limiter_sheet.py'
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          expected_outputs = {'RETURN_LIMITED', 'RETURN_FEED', 'ABSENCE_INFLUENCE'}
          assert set(module.HIER_OUTPUTS) == expected_outputs
          assert module.ALLOWED_AUDIO_EXPORTS == frozenset(expected_outputs)

          unit3 = {pin[0]: pin[1] for pin in module.SSI_UNITS[3]}
          assert unit3 == {'10': 'IIN3', '11': 'VC3', '12': 'IOUT3'}
          unit5 = {pin[0]: pin[1] for pin in module.SSI_UNITS[5]}
          assert unit5 == {'1': 'MODE', '8': 'GND', '16': 'V+', '9': 'V-'}

          assert module.FIXED_FEED_RIN == '40.2k'
          assert module.FIXED_FEED_RF == '27.4k'
          assert math.isclose(module.FIXED_FEED_NOMINAL, 27.4 / 40.2, rel_tol=0, abs_tol=1e-12)
          assert module.LIMIT_REFERENCE == '2.5V'
          assert module.LIMIT_SERIES == '2.2k'

          library = (root / 'MerrinLab_PrototypeA.kicad_sym').read_text(encoding='utf-8')
          assert '(symbol "SSI2164S_APPLICATION"' in library
          assert '(symbol "SSI2164S_APPLICATION_3_1"' in library
          assert '(symbol "SSI2164S_APPLICATION_5_1"' in library
          assert '(symbol "OPA1679_PW_APPLICATION"' in library

          sheet_text = sheet_path.read_text(encoding='utf-8')
          for token in (
              'RETURN_LIMITED', 'RETURN_FEED', 'ABSENCE_INFLUENCE',
              '40.2k', '27.4k', '2.2k', 'SSI2164',
          ):
              assert token in sheet_text, token

          print('Return safety, SSI2164 and fixed-feed contract: PASS')
          PY

      - name: Run KiCad 10 hierarchical ERC
        shell: bash
        run: |
          mkdir -p build/erc
          chmod a+rwx build/erc
          top="hardware/memory-core-prototype-a/MerrinGriefSynthMemoryCoreA.kicad_sch"
          report="build/erc/MerrinGriefSynthMemoryCoreA-erc.rpt"
          set -o pipefail
          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            "$KICAD_IMAGE" \
            kicad-cli sch erc \
              --severity-all \
              --output "$report" \
              "$top" 2>&1 | tee build/erc/kicad-cli.log
          cat "$report"

      - name: Enforce Return-stage ERC policy
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          report = Path('build/erc/MerrinGriefSynthMemoryCoreA-erc.rpt')
          text = report.read_text(encoding='utf-8')
          summary = re.search(r'\*\* ERC messages:\s+(\d+)\s+Errors\s+(\d+)\s+Warnings', text)
          if not summary:
              raise SystemExit('ERC summary was not found')

          errors = int(summary.group(1))
          warnings = int(summary.group(2))
          codes = re.findall(r'^\[([^\]]+)\]:', text, re.MULTILINE)
          unexpected = sorted(set(codes) - {'isolated_pin_label'})

          if errors:
              raise SystemExit(f'Return schematic stage has {errors} ERC error(s)')
          if unexpected:
              raise SystemExit(f'Unexpected ERC classes: {unexpected}')

          captured = (
              '01 POWER / PROTECTION',
              '02 MCU / CLOCK / DEBUG',
              '03 CODEC / CONVERSION',
              '06 RETURN / BREAK / LIMITER',
              '08 CONTROLS / STATE / SAFE SELECTOR',
          )
          for sheet_name in captured:
              match = re.search(
                  rf'\*\* Sheet /{re.escape(sheet_name)}(?P<body>.*?)(?=\*\* Sheet |\*\* ERC messages:)',
                  text,
                  re.DOTALL,
              )
              if match and '[isolated_pin_label]:' in match.group('body'):
                  raise SystemExit(f'{sheet_name} still contains temporary isolated interface labels')

          print(f'Return-stage ERC: PASS — 0 errors, {warnings} remaining scaffold warning(s)')
          PY

      - name: Promote first passing Return sheet
        if: >-
          github.event_name == 'push' &&
          steps.stage.outputs.return == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          root="hardware/memory-core-prototype-a"
          git add \
            "$root/06_RETURN_BREAK_LIMITER.kicad_sch" \
            "$root/06_RETURN_BREAK_LIMITER_CAPTURED" \
            "$root/MerrinLab_PrototypeA.kicad_sym"

          if git diff --cached --quiet; then
            echo "No validated Return stage to promote."
            exit 0
          fi

          git commit -m "Capture ERC-validated Return Break limiter sheet"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload generator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: return-sheet-generator-log
          path: build/generator
          if-no-files-found: ignore

      - name: Upload native hierarchy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: return-sheet-native-hierarchy
          path: hardware/memory-core-prototype-a
          if-no-files-found: error

      - name: Upload ERC diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: return-sheet-erc-report
          path: build/erc
          if-no-files-found: ignore
