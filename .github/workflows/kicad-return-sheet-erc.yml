name: KiCad Return sheet ERC

on:
  push:
    branches:
      - v5.2-native-schematic-capture-erc
    paths:
      - "tools/amend_return_safety_interfaces.py"
      - "tools/capture_return_break_limiter_sheet.py"
      - "tools/repair_return_ssi_units.py"
      - ".github/workflows/kicad-return-sheet-erc.yml"
      - "hardware/memory-core-prototype-a/06_RETURN_BREAK_LIMITER*"
      - "hardware/memory-core-prototype-a/RETURN_SAFETY_INTERFACES_AMENDED"
      - "hardware/memory-core-prototype-a/MerrinGriefSynthMemoryCoreA.kicad_sch"
      - "hardware/memory-core-prototype-a/hierarchy-manifest.json"
      - "hardware/memory-core-prototype-a/MerrinLab_PrototypeA.kicad_sym"
  pull_request:
    paths:
      - "tools/amend_return_safety_interfaces.py"
      - "tools/capture_return_break_limiter_sheet.py"
      - "tools/repair_return_ssi_units.py"
      - ".github/workflows/kicad-return-sheet-erc.yml"
      - "hardware/memory-core-prototype-a/06_RETURN_BREAK_LIMITER*"
      - "hardware/memory-core-prototype-a/RETURN_SAFETY_INTERFACES_AMENDED"
      - "hardware/memory-core-prototype-a/MerrinGriefSynthMemoryCoreA.kicad_sch"
      - "hardware/memory-core-prototype-a/hierarchy-manifest.json"
      - "hardware/memory-core-prototype-a/MerrinLab_PrototypeA.kicad_sym"
  workflow_dispatch:

permissions:
  contents: write

env:
  KICAD_SYMBOL_DIR: /usr/share/kicad/symbols
  KICAD_IMAGE: ghcr.io/kicad/kicad:10.0.4@sha256:770e2fa006695077b5ba218742d5c3137896af91257b2ca971243fa56b01bb86

jobs:
  return-sheet-erc:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect committed Return stage
        id: stage
        shell: bash
        run: |
          marker="hardware/memory-core-prototype-a/06_RETURN_BREAK_LIMITER_CAPTURED"
          if [ -f "$marker" ]; then
            echo "return=true" >> "$GITHUB_OUTPUT"
            echo "Using committed Return/Break/limiter capture."
          else
            echo "return=false" >> "$GITHUB_OUTPUT"
            echo "Return/Break/limiter remains a scaffold."
          fi

      - name: Install symbol libraries and pinned schematic generator
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends kicad-symbols
          python -m pip install --disable-pip-version-check \
            "git+https://github.com/circuit-synth/kicad-sch-api.git@505bca23e91cf3fa6e3b66976e529e775eada3ba"
          python -c "import kicad_sch_api; print('kicad-sch-api import: OK')"
          test -f "$KICAD_SYMBOL_DIR/Connector_Generic.kicad_sym"

      - name: Verify pinned official KiCad CLI image
        run: |
          docker pull "$KICAD_IMAGE"
          docker run --rm "$KICAD_IMAGE" kicad-cli --version
          docker run --rm "$KICAD_IMAGE" kicad-cli sch erc --help

      - name: Add Return safety interfaces
        if: steps.stage.outputs.return == 'false'
        shell: bash
        run: |
          mkdir -p build/generator
          set -o pipefail
          python tools/amend_return_safety_interfaces.py 2>&1 | tee build/generator/return-sheet.log

      - name: Capture and repair 06 Return Break limiter sheet
        if: steps.stage.outputs.return == 'false'
        shell: bash
        run: |
          set -o pipefail
          python tools/capture_return_break_limiter_sheet.py 2>&1 | tee -a build/generator/return-sheet.log
          python tools/repair_return_ssi_units.py 2>&1 | tee -a build/generator/return-sheet.log

      - name: Validate Return capture contract
        run: |
          python - <<'PY'
          import importlib.util
          import math
          import re
          from pathlib import Path

          import kicad_sch_api as ksa

          root = Path('hardware/memory-core-prototype-a')
          sheet_path = root / '06_RETURN_BREAK_LIMITER.kicad_sch'
          library_path = root / 'MerrinLab_PrototypeA.kicad_sym'
          manifest_path = root / 'hierarchy-manifest.json'

          assert (root / '06_RETURN_BREAK_LIMITER_CAPTURED').exists()
          assert (root / 'RETURN_SAFETY_INTERFACES_AMENDED').exists()
          assert sheet_path.exists()
          assert manifest_path.exists()

          spec = importlib.util.spec_from_file_location(
              'return_capture', 'tools/capture_return_break_limiter_sheet.py'
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          repair_spec = importlib.util.spec_from_file_location(
              'return_repair', 'tools/repair_return_ssi_units.py'
          )
          repair = importlib.util.module_from_spec(repair_spec)
          repair_spec.loader.exec_module(repair)

          expected_inputs = {
              'RAIL_P12', 'RAIL_N12', 'RAIL_3V3', 'HARDWARE_FAULT_N',
              'RETURN_DAC', 'VCA_RETURN_CTRL',
          }
          expected_outputs = {'RETURN_LIMITED', 'RETURN_FEED', 'ABSENCE_INFLUENCE'}
          assert set(module.HIER_INPUTS) == expected_inputs
          assert set(module.HIER_OUTPUTS) == expected_outputs
          assert module.ALLOWED_EXPORTS == frozenset(expected_outputs)
          assert math.isclose(module.FIXED_FEED_NOMINAL, 27.4 / 40.2, rel_tol=0, abs_tol=1e-12)
          assert module.FIXED_FEED_NOMINAL < 0.682

          symbol_text = module.render_ssi2164_multi_symbol()
          for unit in range(1, 6):
              assert f'(symbol "SSI2164S_MULTI_{unit}_1"' in symbol_text
          unit3 = re.search(
              r'\(symbol "SSI2164S_MULTI_3_1"(?P<body>.*?)\n\t\t\)',
              symbol_text,
              re.DOTALL,
          )
          assert unit3
          body = unit3.group('body')
          for number, name in (('15', 'IIN3'), ('14', 'VC3'), ('13', 'IOUT3')):
              assert f'(name "{name}"' in body
              assert f'(number "{number}"' in body
          assert 'IIN3' not in re.search(
              r'\(symbol "SSI2164S_MULTI_4_1"(?P<body>.*?)\n\t\t\)',
              symbol_text,
              re.DOTALL,
          ).group('body')

          library = library_path.read_text(encoding='utf-8')
          assert '(symbol "SSI2164S_MULTI"' in library
          assert '(symbol "OPA1679_PW_APPLICATION"' in library

          cache = ksa.get_symbol_cache()
          cache.add_library_path(str(library_path.resolve()))
          schematic = ksa.load_schematic(str(sheet_path))
          ssi_units = sorted(
              component._data.unit
              for component in schematic.components
              if component.reference == 'U60'
          )
          assert ssi_units == [3, 5], ssi_units

          sheet_text = sheet_path.read_text(encoding='utf-8')
          for token in (
              'RETURN_LIMITED', 'RETURN_FEED', 'ABSENCE_INFLUENCE',
              'HARDWARE_FAULT_N', 'RAIL_3V3', '40.2k 1%', '27.4k 1%',
              '2.2k clamp current', 'SSI2164', 'BREAK AMOUNT',
              'Official SSI2164 channel 3 pins: 15 IIN3, 14 VC3, 13 IOUT3',
          ):
              assert token in sheet_text, token
          assert 'reserved no-connect placeholders' not in sheet_text
          assert 'pins 10 IIN3' not in sheet_text

          positions = {
              'SSI_IIN3': repair.actual_pin_position(repair.CHANNEL_POSITION, 'left', 1),
              'SSI_VC3': repair.actual_pin_position(repair.CHANNEL_POSITION, 'left', 3),
              'SSI_IOUT3': repair.actual_pin_position(repair.CHANNEL_POSITION, 'right', 2),
              'GND': repair.actual_pin_position(repair.POWER_POSITION, 'left', 3),
              'RAIL_N12': repair.actual_pin_position(repair.POWER_POSITION, 'left', 4),
              'RAIL_P12': repair.actual_pin_position(repair.POWER_POSITION, 'right', 2),
          }
          for name, (x, y) in positions.items():
              pattern = rf'\(label "{re.escape(name)}"\s+\(at {x:g} {y:g} 0\)'
              if not re.search(pattern, sheet_text):
                  # KiCad may serialise integer-equivalent values with .0.
                  pattern = (
                      rf'\(label "{re.escape(name)}"\s+\(at '
                      rf'{x}(?:0*)? {y}(?:0*)? 0(?:\.0+)?\)'
                  )
                  assert re.search(pattern, sheet_text), (name, x, y)

          mode_x, mode_y = repair.actual_pin_position(repair.POWER_POSITION, 'left', 1)
          assert re.search(
              rf'\(no_connect\s+\(at {mode_x:g} {mode_y:g}\)',
              sheet_text,
          )

          print('Return official pin map, safety interfaces, gain contract and multi-unit placement: PASS')
          PY

      - name: Run KiCad 10 hierarchical ERC
        shell: bash
        run: |
          mkdir -p build/erc
          chmod a+rwx build/erc
          top="hardware/memory-core-prototype-a/MerrinGriefSynthMemoryCoreA.kicad_sch"
          report="build/erc/MerrinGriefSynthMemoryCoreA-erc.rpt"
          set -o pipefail
          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            "$KICAD_IMAGE" \
            kicad-cli sch erc \
              --severity-all \
              --output "$report" \
              "$top" 2>&1 | tee build/erc/kicad-cli.log
          cat "$report"

      - name: Enforce Return-stage ERC policy
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          report = Path('build/erc/MerrinGriefSynthMemoryCoreA-erc.rpt')
          text = report.read_text(encoding='utf-8')
          summary = re.search(r'\*\* ERC messages:\s+(\d+)\s+Errors\s+(\d+)\s+Warnings', text)
          if not summary:
              raise SystemExit('ERC summary was not found')

          errors = int(summary.group(1))
          warnings = int(summary.group(2))
          codes = re.findall(r'^\[([^\]]+)\]:', text, re.MULTILINE)
          unexpected = sorted(set(codes) - {'isolated_pin_label'})

          if errors:
              raise SystemExit(f'Return schematic stage has {errors} ERC error(s)')
          if unexpected:
              raise SystemExit(f'Unexpected ERC classes: {unexpected}')

          captured = (
              '01 POWER / PROTECTION',
              '02 MCU / CLOCK / DEBUG',
              '03 CODEC / CONVERSION',
              '06 RETURN / BREAK / LIMITER',
              '08 CONTROLS / STATE / SAFE SELECTOR',
          )
          for sheet_name in captured:
              match = re.search(
                  rf'\*\* Sheet /{re.escape(sheet_name)}(?P<body>.*?)(?=\*\* Sheet |\*\* ERC messages:)',
                  text,
                  re.DOTALL,
              )
              if match and '[isolated_pin_label]:' in match.group('body'):
                  raise SystemExit(f'{sheet_name} still contains temporary isolated interface labels')

          print(f'Return-stage ERC: PASS — 0 errors, {warnings} remaining scaffold warning(s)')
          PY

      - name: Promote first passing Return sheet
        if: >-
          github.event_name == 'push' &&
          steps.stage.outputs.return == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          root="hardware/memory-core-prototype-a"
          git add \
            "$root/MerrinGriefSynthMemoryCoreA.kicad_sch" \
            "$root/hierarchy-manifest.json" \
            "$root/RETURN_SAFETY_INTERFACES_AMENDED" \
            "$root/06_RETURN_BREAK_LIMITER.kicad_sch" \
            "$root/06_RETURN_BREAK_LIMITER_CAPTURED" \
            "$root/MerrinLab_PrototypeA.kicad_sym"

          if git diff --cached --quiet; then
            echo "No validated Return stage to promote."
            exit 0
          fi

          git commit -m "Capture ERC-validated Return Break limiter sheet"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload generator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: return-sheet-generator-log
          path: build/generator
          if-no-files-found: ignore

      - name: Upload native hierarchy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: return-sheet-native-hierarchy
          path: hardware/memory-core-prototype-a
          if-no-files-found: error

      - name: Upload ERC diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: return-sheet-erc-report
          path: build/erc
          if-no-files-found: ignore
