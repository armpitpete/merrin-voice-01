name: KiCad schematic ERC

on:
  push:
    branches:
      - v5.2-native-schematic-capture-erc
    paths:
      - "hardware/**"
      - "tools/generate_memory_core_hierarchy.py"
      - ".github/workflows/kicad-erc.yml"
  pull_request:
    paths:
      - "hardware/**"
      - "tools/generate_memory_core_hierarchy.py"
      - ".github/workflows/kicad-erc.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  KICAD_SYMBOL_DIR: /usr/share/kicad/symbols

jobs:
  schematic-erc:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install KiCad CLI and pinned schematic generator
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends kicad
          python -m pip install --disable-pip-version-check \
            "git+https://github.com/circuit-synth/kicad-sch-api.git@505bca23e91cf3fa6e3b66976e529e775eada3ba"
          kicad-cli --version
          python -c "import kicad_sch_api; print('kicad-sch-api import: OK')"
          test -f "$KICAD_SYMBOL_DIR/Connector_Generic.kicad_sym"

      - name: Generate native hierarchy and interface capture
        shell: bash
        run: |
          rm -rf hardware/memory-core-prototype-a build/generator
          mkdir -p build/generator
          set -o pipefail
          python tools/generate_memory_core_hierarchy.py 2>&1 | tee build/generator/generator.log
          find hardware/memory-core-prototype-a -maxdepth 1 -type f -print | sort

      - name: Validate hierarchy manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('hardware/memory-core-prototype-a')
          manifest = json.loads((root / 'hierarchy-manifest.json').read_text())

          assert manifest['stage'] == 'hierarchy-and-interface-capture'
          assert manifest['temporary_interface_harnesses'] is True
          assert len(manifest['sheets']) == 9
          assert manifest['return_sheet_allowed_outputs'] == [
              'ABSENCE_INFLUENCE',
              'RETURN_FEED',
              'RETURN_LIMITED',
          ]

          expected = {sheet['filename'] for sheet in manifest['sheets']}
          found = {path.name for path in root.glob('[0-9][0-9]_*.kicad_sch')}
          assert found == expected, (found, expected)
          print('Hierarchy manifest: PASS')
          PY

      - name: Run ERC on top-level hierarchy
        shell: bash
        run: |
          mkdir -p build/erc
          top="hardware/memory-core-prototype-a/MerrinGriefSynthMemoryCoreA.kicad_sch"
          report="build/erc/MerrinGriefSynthMemoryCoreA-erc.rpt"

          kicad-cli sch erc \
            --exit-code-violations \
            --severity-all \
            --output "$report" \
            "$top"

          cat "$report"

      - name: Upload generator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hierarchy-generator-log
          path: build/generator
          if-no-files-found: ignore

      - name: Upload generated native hierarchy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-core-native-hierarchy
          path: hardware/memory-core-prototype-a
          if-no-files-found: error

      - name: Upload ERC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-erc-reports
          path: build/erc
          if-no-files-found: ignore
