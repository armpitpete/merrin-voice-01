name: KiCad schematic ERC

on:
  push:
    branches:
      - v5.2-native-schematic-capture-erc
    paths:
      - "hardware/**"
      - "tools/generate_memory_core_hierarchy.py"
      - "tools/generate_memory_core_hierarchy_v2.py"
      - ".github/workflows/kicad-erc.yml"
  pull_request:
    paths:
      - "hardware/**"
      - "tools/generate_memory_core_hierarchy.py"
      - "tools/generate_memory_core_hierarchy_v2.py"
      - ".github/workflows/kicad-erc.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  KICAD_SYMBOL_DIR: /usr/share/kicad/symbols
  KICAD_IMAGE: ghcr.io/kicad/kicad:10.0.4@sha256:770e2fa006695077b5ba218742d5c3137896af91257b2ca971243fa56b01bb86

jobs:
  schematic-erc:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect committed native hierarchy
        id: native
        shell: bash
        run: |
          top="hardware/memory-core-prototype-a/MerrinGriefSynthMemoryCoreA.kicad_sch"
          if [ -f "$top" ]; then
            echo "committed=true" >> "$GITHUB_OUTPUT"
            echo "Using committed native hierarchy."
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No committed native hierarchy; first passing artifact may be promoted."
          fi

      - name: Install symbol libraries and pinned schematic generator
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            kicad-symbols
          python -m pip install --disable-pip-version-check \
            "git+https://github.com/circuit-synth/kicad-sch-api.git@505bca23e91cf3fa6e3b66976e529e775eada3ba"
          python -c "import kicad_sch_api; print('kicad-sch-api import: OK')"
          test -f "$KICAD_SYMBOL_DIR/Connector_Generic.kicad_sym"

      - name: Verify pinned official KiCad CLI image
        shell: bash
        run: |
          docker pull "$KICAD_IMAGE"
          docker run --rm "$KICAD_IMAGE" kicad-cli --version
          docker run --rm "$KICAD_IMAGE" kicad-cli sch erc --help

      - name: Generate first native hierarchy and interface capture
        if: steps.native.outputs.committed == 'false'
        shell: bash
        run: |
          rm -rf hardware/memory-core-prototype-a build/generator
          mkdir -p build/generator
          set -o pipefail
          python tools/generate_memory_core_hierarchy_v2.py 2>&1 | tee build/generator/generator.log
          find hardware/memory-core-prototype-a -maxdepth 1 -type f -print | sort

      - name: Validate hierarchy manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('hardware/memory-core-prototype-a')
          manifest = json.loads((root / 'hierarchy-manifest.json').read_text())

          assert manifest['stage'] == 'hierarchy-and-interface-capture'
          assert manifest['temporary_interface_harnesses'] is True
          assert len(manifest['sheets']) == 9
          assert manifest['return_sheet_allowed_outputs'] == [
              'ABSENCE_INFLUENCE',
              'RETURN_FEED',
              'RETURN_LIMITED',
          ]

          expected = {sheet['filename'] for sheet in manifest['sheets']}
          found = {path.name for path in root.glob('[0-9][0-9]_*.kicad_sch')}
          assert found == expected, (found, expected)

          power = next(sheet for sheet in manifest['sheets'] if sheet['code'] == '01')
          assert any(pin['name'] == 'WATCHDOG_HEARTBEAT' for pin in power['pins'])
          print('Hierarchy manifest: PASS')
          PY

      - name: Run KiCad 10 ERC report
        shell: bash
        run: |
          mkdir -p build/erc
          chmod a+rwx build/erc
          top="hardware/memory-core-prototype-a/MerrinGriefSynthMemoryCoreA.kicad_sch"
          report="build/erc/MerrinGriefSynthMemoryCoreA-erc.rpt"
          cli_log="build/erc/kicad-cli.log"

          set -o pipefail
          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            "$KICAD_IMAGE" \
            kicad-cli sch erc \
              --severity-all \
              --output "$report" \
              "$top" 2>&1 | tee "$cli_log"

          cat "$report"

      - name: Enforce hierarchy ERC policy
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          report = Path('build/erc/MerrinGriefSynthMemoryCoreA-erc.rpt')
          text = report.read_text(encoding='utf-8')

          summary = re.search(
              r'\*\* ERC messages:\s+(\d+)\s+Errors\s+(\d+)\s+Warnings',
              text,
          )
          if not summary:
              raise SystemExit('ERC summary was not found')

          errors = int(summary.group(1))
          warnings = int(summary.group(2))
          codes = re.findall(r'^\[([^\]]+)\]:', text, re.MULTILINE)
          unexpected = sorted(set(codes) - {'isolated_pin_label'})

          if errors:
              raise SystemExit(f'Hierarchy ERC has {errors} error(s)')
          if unexpected:
              raise SystemExit(f'Unexpected hierarchy warning/error classes: {unexpected}')

          print(f'Hierarchy ERC: PASS — 0 errors, {warnings} temporary harness warning(s)')
          print('Allowed warning class: isolated_pin_label')
          PY

      - name: Promote first passing native hierarchy
        if: >-
          github.event_name == 'push' &&
          steps.native.outputs.committed == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          root="hardware/memory-core-prototype-a"
          git add \
            "$root"/*.kicad_sch \
            "$root"/*.kicad_pro \
            "$root"/hierarchy-manifest.json

          if git diff --cached --quiet; then
            echo "No native hierarchy changes to promote."
            exit 0
          fi

          git commit -m "Add ERC-validated native hierarchy capture"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload generator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hierarchy-generator-log
          path: build/generator
          if-no-files-found: ignore

      - name: Upload native hierarchy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-core-native-hierarchy
          path: hardware/memory-core-prototype-a
          if-no-files-found: error

      - name: Upload ERC diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-erc-reports
          path: build/erc
          if-no-files-found: ignore
