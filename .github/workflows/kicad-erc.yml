name: KiCad schematic ERC

on:
  push:
    branches:
      - v5.2-native-schematic-capture-erc
    paths:
      - "hardware/**"
      - "tools/generate_memory_core_hierarchy.py"
      - "tools/generate_memory_core_hierarchy_v2.py"
      - "tools/capture_power_protection_sheet.py"
      - "tools/capture_power_protection_sheet_v2.py"
      - "tools/capture_power_protection_sheet_v3.py"
      - "tools/amend_controls_state_interfaces.py"
      - "tools/capture_controls_state_sheet.py"
      - ".github/workflows/kicad-erc.yml"
  pull_request:
    paths:
      - "hardware/**"
      - "tools/generate_memory_core_hierarchy.py"
      - "tools/generate_memory_core_hierarchy_v2.py"
      - "tools/capture_power_protection_sheet.py"
      - "tools/capture_power_protection_sheet_v2.py"
      - "tools/capture_power_protection_sheet_v3.py"
      - "tools/amend_controls_state_interfaces.py"
      - "tools/capture_controls_state_sheet.py"
      - ".github/workflows/kicad-erc.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  KICAD_SYMBOL_DIR: /usr/share/kicad/symbols
  KICAD_IMAGE: ghcr.io/kicad/kicad:10.0.4@sha256:770e2fa006695077b5ba218742d5c3137896af91257b2ca971243fa56b01bb86

jobs:
  schematic-erc:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect committed stages
        id: stage
        shell: bash
        run: |
          root="hardware/memory-core-prototype-a"
          test -f "$root/MerrinGriefSynthMemoryCoreA.kicad_sch" && hierarchy=true || hierarchy=false
          test -f "$root/01_POWER_PROTECTION_CAPTURED" && power=true || power=false
          test -f "$root/CONTROLS_INTERFACES_AMENDED" && controls_interfaces=true || controls_interfaces=false
          test -f "$root/08_CONTROLS_STATE_CAPTURED" && controls=true || controls=false

          echo "hierarchy=$hierarchy" >> "$GITHUB_OUTPUT"
          echo "power=$power" >> "$GITHUB_OUTPUT"
          echo "controls_interfaces=$controls_interfaces" >> "$GITHUB_OUTPUT"
          echo "controls=$controls" >> "$GITHUB_OUTPUT"

          echo "hierarchy=$hierarchy power=$power controls_interfaces=$controls_interfaces controls=$controls"

      - name: Install symbol libraries and pinned schematic generator
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends kicad-symbols
          python -m pip install --disable-pip-version-check \
            "git+https://github.com/circuit-synth/kicad-sch-api.git@505bca23e91cf3fa6e3b66976e529e775eada3ba"
          python -c "import kicad_sch_api; print('kicad-sch-api import: OK')"
          test -f "$KICAD_SYMBOL_DIR/Connector_Generic.kicad_sym"

      - name: Verify pinned official KiCad CLI image
        run: |
          docker pull "$KICAD_IMAGE"
          docker run --rm "$KICAD_IMAGE" kicad-cli --version
          docker run --rm "$KICAD_IMAGE" kicad-cli sch erc --help

      - name: Generate first native hierarchy
        if: steps.stage.outputs.hierarchy == 'false'
        shell: bash
        run: |
          rm -rf hardware/memory-core-prototype-a build/generator
          mkdir -p build/generator
          set -o pipefail
          python tools/generate_memory_core_hierarchy_v2.py 2>&1 | tee build/generator/hierarchy.log

      - name: Capture 01 power and protection sheet
        if: steps.stage.outputs.power == 'false'
        shell: bash
        run: |
          mkdir -p build/generator
          set -o pipefail
          python tools/capture_power_protection_sheet_v2.py 2>&1 | tee build/generator/power-sheet.log

      - name: Add controls and operating interfaces
        if: steps.stage.outputs.controls_interfaces == 'false'
        shell: bash
        run: |
          mkdir -p build/generator
          set -o pipefail
          python tools/amend_controls_state_interfaces.py 2>&1 | tee build/generator/controls-interfaces.log

      - name: Capture 08 controls and state sheet
        if: steps.stage.outputs.controls == 'false'
        shell: bash
        run: |
          mkdir -p build/generator
          set -o pipefail
          python tools/capture_controls_state_sheet.py 2>&1 | tee build/generator/controls-sheet.log

      - name: Validate hierarchy and stage markers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('hardware/memory-core-prototype-a')
          manifest = json.loads((root / 'hierarchy-manifest.json').read_text())
          assert manifest['stage'] == 'hierarchy-and-interface-capture'
          assert len(manifest['sheets']) == 9
          assert manifest['return_sheet_allowed_outputs'] == [
              'ABSENCE_INFLUENCE', 'RETURN_FEED', 'RETURN_LIMITED'
          ]

          expected = {sheet['filename'] for sheet in manifest['sheets']}
          found = {path.name for path in root.glob('[0-9][0-9]_*.kicad_sch')}
          assert found == expected, (found, expected)

          panel = {
              'PANEL_MEMORY_TIME', 'PANEL_MEMORY_FADE', 'PANEL_MEMORY_BLUR',
              'PANEL_GHOST_DISTANCE', 'PANEL_GHOST_DRIFT', 'PANEL_GHOST_PRESENCE',
              'PANEL_RETURN_AMOUNT', 'PANEL_PRESENT_WET',
          }
          operating = {'SERVICE_TEST', 'RESET_CLEAR', 'SAFE_MUTE'}
          required = panel | operating
          sheet02 = next(sheet for sheet in manifest['sheets'] if sheet['code'] == '02')
          sheet08 = next(sheet for sheet in manifest['sheets'] if sheet['code'] == '08')
          pins02 = {pin['name'] for pin in sheet02['pins']}
          pins08 = {pin['name'] for pin in sheet08['pins']}
          assert required <= pins02
          assert required <= pins08

          for marker in (
              '01_POWER_PROTECTION_CAPTURED',
              'CONTROLS_INTERFACES_AMENDED',
              '08_CONTROLS_STATE_CAPTURED',
          ):
              assert (root / marker).exists(), marker

          assert (root / 'MerrinLab_PrototypeA.kicad_sym').exists()
          assert (root / 'sym-lib-table').exists()
          print('Hierarchy and component-stage markers: PASS')
          PY

      - name: Run KiCad 10 ERC report
        shell: bash
        run: |
          mkdir -p build/erc
          chmod a+rwx build/erc
          top="hardware/memory-core-prototype-a/MerrinGriefSynthMemoryCoreA.kicad_sch"
          report="build/erc/MerrinGriefSynthMemoryCoreA-erc.rpt"
          set -o pipefail
          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            "$KICAD_IMAGE" \
            kicad-cli sch erc \
              --severity-all \
              --output "$report" \
              "$top" 2>&1 | tee build/erc/kicad-cli.log
          cat "$report"

      - name: Enforce current-stage ERC policy
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          report = Path('build/erc/MerrinGriefSynthMemoryCoreA-erc.rpt')
          text = report.read_text(encoding='utf-8')
          summary = re.search(r'\*\* ERC messages:\s+(\d+)\s+Errors\s+(\d+)\s+Warnings', text)
          if not summary:
              raise SystemExit('ERC summary was not found')

          errors = int(summary.group(1))
          warnings = int(summary.group(2))
          codes = re.findall(r'^\[([^\]]+)\]:', text, re.MULTILINE)
          unexpected = sorted(set(codes) - {'isolated_pin_label'})
          if errors:
              raise SystemExit(f'Current schematic stage has {errors} ERC error(s)')
          if unexpected:
              raise SystemExit(f'Unexpected ERC classes: {unexpected}')

          for sheet_name in ('01 POWER / PROTECTION', '08 CONTROLS / STATE / SAFE SELECTOR'):
              match = re.search(
                  rf'\*\* Sheet /{re.escape(sheet_name)}(?P<body>.*?)(?=\*\* Sheet |\*\* ERC messages:)',
                  text,
                  re.DOTALL,
              )
              if match and '[isolated_pin_label]:' in match.group('body'):
                  raise SystemExit(f'{sheet_name} still contains temporary isolated interface labels')

          print(f'ERC stage policy: PASS — 0 errors, {warnings} remaining scaffold warning(s)')
          PY

      - name: Promote first passing hierarchy and component stages
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          root="hardware/memory-core-prototype-a"

          if [ "${{ steps.stage.outputs.hierarchy }}" = "false" ]; then
            git add "$root"/*.kicad_sch "$root"/*.kicad_pro "$root"/hierarchy-manifest.json
          fi

          if [ "${{ steps.stage.outputs.power }}" = "false" ]; then
            git add \
              "$root/01_POWER_PROTECTION.kicad_sch" \
              "$root/01_POWER_PROTECTION_CAPTURED" \
              "$root/MerrinLab_PrototypeA.kicad_sym" \
              "$root/sym-lib-table"
          fi

          if [ "${{ steps.stage.outputs.controls_interfaces }}" = "false" ]; then
            git add \
              "$root/MerrinGriefSynthMemoryCoreA.kicad_sch" \
              "$root/02_MCU_CLOCK_DEBUG.kicad_sch" \
              "$root/hierarchy-manifest.json" \
              "$root/CONTROLS_INTERFACES_AMENDED"
          fi

          if [ "${{ steps.stage.outputs.controls }}" = "false" ]; then
            git add \
              "$root/08_CONTROLS_STATE.kicad_sch" \
              "$root/08_CONTROLS_STATE_CAPTURED" \
              "$root/MerrinLab_PrototypeA.kicad_sym" \
              "$root/sym-lib-table"
          fi

          if git diff --cached --quiet; then
            echo "No validated native stage to promote."
            exit 0
          fi

          git commit -m "Capture ERC-validated controls and state sheet"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload generator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schematic-generator-logs
          path: build/generator
          if-no-files-found: ignore

      - name: Upload native hierarchy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-core-native-hierarchy
          path: hardware/memory-core-prototype-a
          if-no-files-found: error

      - name: Upload ERC diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-erc-reports
          path: build/erc
          if-no-files-found: ignore
