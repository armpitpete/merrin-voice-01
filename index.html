<!doctype html>
<html lang="en" data-link-mode="linked">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Merrin Voice 01 — Interactive Signal Guide</title>
  <meta name="description" content="Interactive guide to the Merrin Voice 01 Constrained Grief Eurorack voice.">
  <style>
    :root{color-scheme:dark;--bg:#0d0f14;--panel:#161922;--panel2:#202531;--ink:#f2f0ea;--muted:#b9b3a7;--quiet:#827b70;--line:rgba(242,240,234,.18);--accent:#caa06a;--blue:#8fa7c4;--font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:var(--font);line-height:1.5;color:var(--ink);background:radial-gradient(circle at top left,rgba(143,167,196,.16),transparent 35rem),radial-gradient(circle at bottom right,rgba(202,160,106,.12),transparent 34rem),var(--bg)}button{font:inherit}code{font-family:var(--mono)}
    .app{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:32px 0 44px}.eyebrow{margin:0;color:var(--accent);text-transform:uppercase;letter-spacing:.16em;font-size:.76rem;font-weight:800}h1{margin:0;font-size:clamp(2.1rem,7vw,5rem);line-height:.95;letter-spacing:-.07em}.intro{max-width:760px;margin:0;color:var(--muted);font-size:clamp(1rem,2vw,1.18rem)}header{display:grid;gap:14px;margin-bottom:24px}
  </style>
</head>
<body>
  <main class="app">
    <p class="eyebrow">Merrin Voice 01 App v3.3</p>
    <h1>Constrained Grief</h1>
    <p class="intro">Temporary sound-engine repair page.</p>
  </main>
